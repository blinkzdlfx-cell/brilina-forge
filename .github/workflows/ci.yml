name: Brilina Forge CI

on:
  push:
    branches: [main, 'phase-1/**', 'phase-4/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npm install
        working-directory: web
      - run: npm run build
        working-directory: web
